<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style>
<title>Atlas</title>
<meta name="description" content="Atlas workout planner">
<meta name="theme-color" content="#ECEEF1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E1115" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">

<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

<style>
/* Layout: one-column phone app shell — sticky wordmark header, scrolling content, fixed bottom tab bar */
:root{
  --bg:#ECEEF1; --surface:#FFFFFF; --surface-2:#F4F5F7; --ink:#13171C; --muted:#59626E; --line:#D5DAE0;
  --accent:#1D4ED8; --accent-ink:#FFFFFF; --accent-soft:#DFE6FA;
  --cardio:#A85A06; --cardio-soft:#F9EAD3;
  --good:#167A3E; --good-soft:#DCF1E3; --bad:#B42318; --bad-soft:#FBE3E1;
  --f-display:'Barlow Condensed','Arial Narrow',Arial,sans-serif;
  --f-body:'Public Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1115; --surface:#171B21; --surface-2:#1E232A; --ink:#E6E9ED; --muted:#98A1AC; --line:#2B313A;
  --accent:#7B98FF; --accent-ink:#0B0E13; --accent-soft:#1E2950;
  --cardio:#EBA94A; --cardio-soft:#3A2A12;
  --good:#5BC98A; --good-soft:#143323; --bad:#F2766B; --bad-soft:#3D1A17; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0E1115; --surface:#171B21; --surface-2:#1E232A; --ink:#E6E9ED; --muted:#98A1AC; --line:#2B313A;
  --accent:#7B98FF; --accent-ink:#0B0E13; --accent-soft:#1E2950;
  --cardio:#EBA94A; --cardio-soft:#3A2A12;
  --good:#5BC98A; --good-soft:#143323; --bad:#F2766B; --bad-soft:#3D1A17; color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--bg)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.shell{max-width:720px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 150px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--bg);display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:12px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:8px;font-family:var(--f-display);font-weight:800;font-size:24px;letter-spacing:.14em;color:var(--ink)}
.brand svg{color:var(--accent)}
.who{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:6px 12px 6px 8px;font-weight:600;font-size:14px;max-width:55%}
.who span.nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who .av{width:22px;height:22px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-size:12px;font-weight:700;flex:none}
main{display:flex;flex-direction:column;gap:14px;padding-top:16px}
h1,h2,h3{margin:0;text-wrap:balance}
h1{font-family:var(--f-display);font-weight:700;font-size:34px;line-height:1.02;letter-spacing:.01em}
h2{font-family:var(--f-display);font-weight:700;font-size:22px;letter-spacing:.02em}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.meta{margin:6px 0 0;color:var(--muted)}
.dayhead{display:flex;flex-direction:column;gap:4px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.note{font-size:13.5px;color:var(--muted);margin:0}
.banner{border-radius:var(--r);padding:10px 12px;font-size:13.5px;background:var(--accent-soft);color:var(--ink)}
.banner.warn{background:var(--cardio-soft)}
.banner.bad{background:var(--bad-soft)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:8px;padding:12px 16px;font-weight:700;background:var(--accent);color:var(--accent-ink)}
.btn.wide{width:100%}
.btn.sec{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:var(--bad);color:#fff}
.ghost{border:1px solid var(--line);background:transparent;border-radius:7px;padding:5px 10px;font-size:13px;font-weight:600;color:var(--ink)}
.link{background:none;border:0;padding:0;color:var(--accent);font-weight:600}

/* week strip */
.strip{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.dcell{display:flex;flex-direction:column;align-items:center;gap:5px;padding:8px 0 9px;border-radius:9px;border:1px solid var(--line);background:var(--surface);font-size:12px;font-weight:700;color:var(--muted)}
.dcell[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent);color:var(--ink)}
.dcell .num{font-family:var(--f-mono);font-size:13px;color:var(--ink)}
.dcell.today .num{background:var(--ink);color:var(--bg);border-radius:5px;padding:0 5px}
.marks{display:flex;gap:3px;height:9px;align-items:center}
.mk{width:9px;height:9px;border-radius:2px}
.mk.lift{background:var(--accent)}
.mk.cardio{border:2px solid var(--cardio);border-radius:50%}
.mk.rest{width:9px;height:2px;background:var(--line)}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.legend span{display:inline-flex;align-items:center;gap:5px}

/* exercise card */
.ex{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:12px}
.ex.paired{border-left:3px solid var(--accent)}
.exhead{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start}
.lab{font-family:var(--f-mono);font-weight:600;font-size:13px;background:var(--accent-soft);color:var(--accent);border-radius:6px;padding:3px 7px;min-width:34px;text-align:center}
.exname{min-width:0}
.exname h3{font-size:17px;font-weight:700;line-height:1.25}
.mus{font-size:12.5px;color:var(--muted);margin-top:2px}
.exbtns{grid-column:1/-1;display:flex;gap:6px}
.rx{display:flex;align-items:center;gap:14px}
.target{display:flex;align-items:baseline;gap:4px;min-width:96px}
.target b{font-family:var(--f-mono);font-size:30px;font-weight:600;letter-spacing:-.02em;line-height:1}
.target b.sm{font-family:var(--f-display);font-size:22px;letter-spacing:.02em}
.target small{color:var(--muted);font-weight:600;font-size:13px}
.rxline{font-family:var(--f-mono);font-size:14px;font-weight:600;font-variant-numeric:tabular-nums}
.rxline span{font-family:var(--f-body);font-weight:500;font-size:12.5px;color:var(--muted)}
.last{margin:0;font-family:var(--f-mono);font-size:13px;font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums}
.hint{margin:0;font-size:13px;color:var(--muted);background:var(--surface-2);border-radius:7px;padding:7px 10px}
.sets{display:flex;flex-direction:column;gap:6px}
.setrow{display:grid;grid-template-columns:22px 1fr 1fr 44px;gap:8px;align-items:center}
.sn{font-family:var(--f-mono);font-size:13px;color:var(--muted);text-align:center}
.fld{display:flex;align-items:center;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:0 10px;height:42px;min-width:0}
.fld input{width:100%;min-width:0;border:0;background:transparent;font-family:var(--f-mono);font-size:16px;font-weight:600;padding:0;outline:none;font-variant-numeric:tabular-nums}
.fld input::placeholder{color:var(--muted);opacity:.7}
.fld span{font-size:12px;color:var(--muted);margin-left:4px}
.fld:focus-within{border-color:var(--accent)}
.bwtag{font-size:13px;color:var(--muted);justify-content:center}
.chk{width:44px;height:42px;border-radius:8px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;color:var(--muted)}
.chk[aria-pressed="true"]{background:var(--good);border-color:var(--good);color:#fff}
.setrow.done .fld{background:var(--good-soft);border-color:transparent}

/* cardio + rest */
.cardio{border-color:var(--cardio);background:linear-gradient(0deg,var(--surface),var(--surface)) padding-box}
.ctag{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--cardio)}
.ctitle{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin:6px 0 4px}
.ctitle h3{font-family:var(--f-display);font-size:22px;font-weight:700}
.ctitle .mins{font-family:var(--f-mono);font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.pill{display:inline-flex;align-items:center;font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--surface-2);color:var(--ink);border:1px solid var(--line)}
.pill.lift{background:var(--accent-soft);border-color:transparent;color:var(--accent)}
.pill.cardio{background:var(--cardio-soft);border-color:transparent;color:var(--cardio)}
.pill.rest{color:var(--muted)}

/* week rows */
.wrow{display:grid;grid-template-columns:52px 1fr;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px}
.wrow.istoday{border-color:var(--accent)}
.wday{display:flex;flex-direction:column;align-items:flex-start}
.wday b{font-family:var(--f-display);font-size:20px;font-weight:700;letter-spacing:.04em}
.wday span{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.wbody{display:flex;flex-direction:column;gap:6px;min-width:0}
.wname{font-weight:700}
.wsub{font-size:13px;color:var(--muted)}
.mini{display:flex;flex-direction:column;border-top:1px solid var(--line);margin-top:4px}
.mini div{display:grid;grid-template-columns:30px 1fr auto auto;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.mini div:last-child{border-bottom:0}
.mini .l{font-family:var(--f-mono);font-size:12px;color:var(--accent);font-weight:600}
.mini .w{font-family:var(--f-mono);font-size:13px;color:var(--muted);white-space:nowrap}
.rules{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px;font-size:14px}

/* library */
.mchips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.mchips button{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600}
.mchips button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.lrow{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;text-align:left;width:100%}
.lrow.off{opacity:.55}
.lrow b{font-weight:700;display:block}
.lrow small{color:var(--muted);font-size:12.5px}
.tag{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.tag.in{color:var(--accent)}

/* progress */
.vol{display:flex;flex-direction:column;gap:8px}
.vrow{display:grid;grid-template-columns:86px 1fr 34px;gap:10px;align-items:center;font-size:13px}
.vtrack{position:relative;height:12px;background:var(--surface-2);border-radius:3px;overflow:hidden}
.vband{position:absolute;top:0;bottom:0;background:var(--good-soft)}
.vbar{position:absolute;left:0;top:3px;bottom:3px;background:var(--accent);border-radius:2px}
.vnum{font-family:var(--f-mono);font-size:13px;text-align:right;font-variant-numeric:tabular-nums}
.lift{display:grid;grid-template-columns:1fr 120px;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.lift:last-child{border-bottom:0}
.lift b{display:block;font-weight:700}
.lift small{font-family:var(--f-mono);color:var(--muted);font-size:12.5px}
.spark{width:120px;height:34px}
.sess{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
.sess:last-child{border-bottom:0}
.sess span{font-family:var(--f-mono);color:var(--muted);font-size:13px;white-space:nowrap}

/* form */
form.setup{display:flex;flex-direction:column;gap:16px}
fieldset{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);padding:14px;margin:0;display:flex;flex-direction:column;gap:12px;min-width:0}
legend{font-family:var(--f-display);font-weight:700;font-size:19px;letter-spacing:.03em;padding:0 6px}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.f{display:flex;flex-direction:column;gap:5px;min-width:0}
.f > span{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.f input,.f select{height:44px;border:1px solid var(--line);border-radius:8px;background:var(--surface-2);padding:0 10px;font-size:16px;width:100%;min-width:0}
.f small{color:var(--muted);font-size:12.5px}
.ht{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.cbx{display:flex;flex-wrap:wrap;gap:6px}
.cbx label{position:relative;display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:999px;padding:7px 12px;font-size:13.5px;font-weight:600;background:var(--surface-2);cursor:pointer;user-select:none}
.cbx input{position:absolute;opacity:0;width:1px;height:1px}
.cbx label:has(input:checked){background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.cbx label:has(input:focus-visible){outline:2px solid var(--accent);outline-offset:2px}
.seg{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:6px}
.seg label{position:relative;border:1px solid var(--line);border-radius:9px;padding:10px 12px;background:var(--surface-2);cursor:pointer;display:flex;flex-direction:column;gap:2px}
.seg input{position:absolute;opacity:0;width:1px;height:1px}
.seg b{font-size:14px}
.seg small{font-size:12px;color:var(--muted)}
.seg label:has(input:checked){border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent);background:var(--accent-soft)}
.seg label:has(input:focus-visible){outline:2px solid var(--accent);outline-offset:2px}
.formerr{color:var(--bad);font-weight:600;font-size:14px;margin:0}
.people{display:flex;flex-direction:column}
.person{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.person:last-child{border-bottom:0}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:14px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;font-weight:600}

/* tabs, timer, sheet */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px))}
.tabs div{max-width:720px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.tabs button{border:0;background:none;padding:12px 2px 13px;font-family:var(--f-display);font-weight:700;font-size:15px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);position:relative}
.tabs button[aria-current="page"]{color:var(--ink)}
.tabs button[aria-current="page"]::before{content:"";position:absolute;top:0;left:22%;right:22%;height:3px;background:var(--accent);border-radius:0 0 3px 3px}
.timer{position:fixed;left:0;right:0;z-index:31;bottom:calc(49px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-bottom:8px}
.timer > div{max-width:720px;margin:0 auto;background:var(--ink);color:var(--bg);border-radius:12px;padding:10px 12px;display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;box-shadow:0 6px 20px rgba(0,0,0,.25)}
.tt{font-family:var(--f-mono);font-size:24px;font-weight:600;min-width:66px;font-variant-numeric:tabular-nums}
.tl{font-size:13px;font-weight:600}
.tbar{height:4px;background:color-mix(in srgb,var(--bg) 25%,transparent);border-radius:2px;margin-top:6px;overflow:hidden}
.tbar i{display:block;height:100%;background:var(--accent);width:0}
.timer button{border:1px solid color-mix(in srgb,var(--bg) 40%,transparent);background:transparent;color:var(--bg);border-radius:7px;padding:6px 10px;font-weight:700;font-size:13px}
.scrim{position:fixed;inset:0;z-index:50;background:rgba(10,12,16,.5);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:720px;max-height:82%;overflow:auto;border-radius:16px 16px 0 0;padding:16px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:12px}
.sheethead{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.opt{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px}
.opt[aria-current="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.opt:disabled{opacity:.5;cursor:not-allowed}
.opt b{display:block}
.opt small{color:var(--muted);font-size:12.5px}
.loading{min-height:60vh;display:grid;place-items:center;color:var(--muted)}
.sum li{margin-bottom:4px}
.up{color:var(--good);font-weight:700}
/* coach, muscle status, guided mode */
.coach{display:flex;flex-direction:column;gap:12px}
.coach h2{font-size:24px}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.step{display:grid;grid-template-columns:26px 1fr;gap:10px;padding:9px 0;border-top:1px solid var(--line)}
.step .n{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-mono);font-size:12px;font-weight:600;border:1.5px solid var(--line);color:var(--muted)}
.step.ok .n{background:var(--good);border-color:var(--good);color:#fff}
.step.now .n{border-color:var(--accent);color:var(--accent)}
.step b{display:block;font-size:15px}
.step.ok b{color:var(--muted);font-weight:600}
.step small{color:var(--muted);font-size:13px}
.step .act{margin-top:8px;display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.energy{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;width:100%}
.energy button{border:1px solid var(--line);background:var(--surface-2);border-radius:9px;padding:9px 4px;font-weight:600;font-size:13px}
.energy button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.soreb{display:flex;flex-wrap:wrap;gap:6px}
.soreb button{border:1px solid var(--line);background:var(--surface-2);border-radius:999px;padding:5px 10px;font-size:12.5px;font-weight:600}
.soreb button[aria-pressed="true"]{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.ramp{font-family:var(--f-mono);font-size:13.5px;font-weight:600}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(98px,1fr));gap:6px}
.tile{border-radius:8px;padding:8px 9px;background:var(--surface-2);border-left:3px solid var(--line);display:flex;flex-direction:column;gap:1px}
.tile b{font-size:13px}
.tile span{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.tile.recovering{border-left-color:var(--accent)}
.tile.ready{border-left-color:var(--good)}
.tile.due{border-left-color:var(--cardio);background:var(--cardio-soft)}
.tile.overdue{border-left-color:var(--bad);background:var(--bad-soft)}
.alert{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:8px 0;border-top:1px solid color-mix(in srgb,var(--bad) 25%,transparent)}
.alert:first-of-type{border-top:0}
.guide{background:var(--surface);border:1.5px solid var(--accent);border-radius:14px;padding:18px 16px;display:flex;flex-direction:column;gap:14px}
.gprog{height:5px;background:var(--surface-2);border-radius:3px;overflow:hidden}
.gprog i{display:block;height:100%;background:var(--accent)}
.gname{font-family:var(--f-display);font-size:30px;line-height:1.05}
.cue{margin:0;font-size:14px}
.stepper{display:grid;grid-template-columns:52px 1fr 52px;gap:8px;align-items:center}
.stepper button{height:52px;border-radius:10px;border:1px solid var(--line);background:var(--surface-2);font-size:22px;font-weight:700}
.stepper .val{text-align:center}
.stepper .val b{font-family:var(--f-mono);font-size:34px;font-weight:600;letter-spacing:-.02em}
.stepper .val small{display:block;font-size:12px;color:var(--muted);font-weight:600}
.btn.big{padding:16px;font-size:17px}
.upnext{font-size:13.5px;color:var(--muted);border-top:1px solid var(--line);padding-top:10px}
.cdone{color:var(--good);font-weight:700;font-size:14px}
.cheer{margin:6px 0 0;font-size:14.5px;line-height:1.45;color:var(--ink);border-left:3px solid var(--accent);padding-left:10px}
.figs{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:4px;background:var(--surface-2);border-radius:10px;padding:8px}
.figs.one{grid-template-columns:1fr;max-width:280px;margin:0 auto}
.fig{margin:0;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:0}
.fig svg{width:100%;max-width:220px;height:auto;display:block}
.fig figcaption{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.figarrow{font-size:20px;color:var(--accent);font-weight:700}
.subh{font-family:var(--f-display);font-size:18px;font-weight:700;letter-spacing:.02em;margin:14px 0 6px}
.howto{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px;font-size:14.5px}
.avoid{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px;font-size:14px;color:var(--ink)}
.avoid li::marker{color:var(--bad)}
.keycue{margin:12px 0 0;font-size:14.5px;background:var(--accent-soft);border-radius:8px;padding:8px 10px}
.why ul{margin:6px 0 6px;padding-left:18px;display:flex;flex-direction:column;gap:5px;font-size:14px}
.why{border-left:3px solid var(--accent)}
.effort{font-family:var(--f-body);font-size:12.5px;font-weight:700;color:var(--accent)}
.meso{display:flex;flex-direction:column;gap:8px}
.mesobar{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.mesobar span{height:28px;border-radius:5px;background:var(--surface-2);display:grid;place-items:center;font-size:11px;font-weight:700;color:var(--muted);letter-spacing:.04em}
.mesobar span.on{background:var(--accent);color:var(--accent-ink)}
.mesobar span.dl{border:1px dashed var(--line)}
.gcheer{margin:0;font-weight:700;color:var(--good);font-size:15px}
/* calendar */
.calhead{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.calnav{display:flex;align-items:center;gap:6px}
.calm{font-family:var(--f-display);font-weight:700;font-size:17px;min-width:118px;text-align:center;letter-spacing:.02em}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px;margin-top:10px}
.calw{font-size:11px;font-weight:700;letter-spacing:.06em;color:var(--muted);text-align:center;padding:2px 0 4px}
.calc{min-height:56px;border-radius:6px;background:var(--surface-2);border:1px solid transparent;padding:4px;display:flex;flex-direction:column;gap:3px;text-align:left;min-width:0}
.calc.empty{background:transparent}
.calc.has{background:var(--surface);border-color:var(--line)}
.calc[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.calc.today .cd{background:var(--ink);color:var(--bg);border-radius:4px;padding:0 4px}
.cd{font-family:var(--f-mono);font-size:12px;font-weight:600;align-self:flex-start}
.cm{display:flex;flex-direction:column;gap:2px}
.cm i{display:block;height:4px;border-radius:2px}
.cm i.l{background:var(--accent)}
.cm i.c{background:var(--cardio)}
.ct{font-size:10.5px;line-height:1.2;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media (max-width:520px){.ct{display:none}}
.caldet{border-top:1px solid var(--line);margin-top:12px;padding-top:10px;display:flex;flex-direction:column;gap:8px}
.caldet .xl{font-size:13.5px;display:grid;grid-template-columns:1fr auto;gap:10px}
.caldet .xl span:last-child{font-family:var(--f-mono);color:var(--muted);font-size:12.5px;text-align:right}
@media (prefers-reduced-motion:no-preference){.ex,.wrow,.card{transition:border-color .15s}.tbar i{transition:width .5s linear}}

  const P=parsePose(poseStr),line=(a,b,w,c,op)=>a&&b?`<line x1="${a[0]}" y1="${a[1]}" x2="${b[0]}" y2="${b[1]}" stroke="${c||'var(--ink)'}" stroke-width="${w||6}" stroke-linecap="round"${op?` opacity="${op}"`:''}/>`:'';
  const mir=p=>p&&[200-p[0],p[1]];
  let g=`<line x1="4" y1="141" x2="196" y2="141" stroke="var(--line)" stroke-width="2"/>`;
  (pat.props||[]).forEach(pr=>{if(pr[0]==='rect')g+=`<rect x="${pr[1]}" y="${pr[2]}" width="${pr[3]}" height="${pr[4]}" rx="2" fill="var(--line)"/>`;else g+=line([pr[1],pr[2]],[pr[3],pr[4]],pr[5]||4,'var(--line)');});
  const load=ex.id==='swing'?'bell':ex.load;
  const W=P.W,cable=pat.anchor&&(load==='stack'||load==='band');
  if(cable&&W)g+=`<line x1="${pat.anchor[0]}" y1="${pat.anchor[1]}" x2="${W[0]}" y2="${W[1]}" stroke="var(--muted)" stroke-width="1.5"${load==='band'?' stroke-dasharray="4 3"':''}/>`;
  if(pat.sled&&P.A&&P.K){const dx=P.A[0]-P.K[0],dy=P.A[1]-P.K[1],l=Math.hypot(dx,dy)||1,nx=-dy/l*16,ny=dx/l*16,ox=dx/l*5,oy=dy/l*5;g+=`<line x1="${P.A[0]+nx+ox}" y1="${P.A[1]+ny+oy}" x2="${P.A[0]-nx+ox}" y2="${P.A[1]-ny+oy}" stroke="var(--muted)" stroke-width="5" stroke-linecap="round"/>`;}
  if(pat.front){
    g+=line(P.P,P.K)+line(P.K,P.A)+line(P.A,P.T,5)+line(mir(P.P),mir(P.K))+line(mir(P.K),mir(P.A))+line(mir(P.A),mir(P.T),5);
    g+=line(P.S,mir(P.S))+line(P.P,mir(P.P))+line([100,P.S[1]],[100,P.P[1]]);
    g+=line(P.S,P.E)+line(P.E,P.W)+line(mir(P.S),mir(P.E))+line(mir(P.E),mir(P.W));
    if(ex.id==='bandwalk')g+=`<line x1="${P.K[0]}" y1="${P.K[1]-6}" x2="${200-P.K[0]}" y2="${P.K[1]-6}" stroke="var(--accent)" stroke-width="2.5"/>`;
    if(load==='band'&&ex.id!=='bandwalk')g+=`<line x1="${P.W[0]}" y1="${P.W[1]}" x2="${200-P.W[0]}" y2="${P.W[1]}" stroke="var(--accent)" stroke-width="2.5"/>`;
    if(load==='db'||load==='db1'||load==='stack')[P.W,mir(P.W)].forEach(w=>g+=wt(load==='stack'?'handle':'db',w));
  }else{
    if(P.k)g+=line(P.P,P.k,6,null,.35)+line(P.k,P.a,6,null,.35);
    g+=line(P.P,P.S)+line(P.P,P.K)+line(P.K,P.A)+line(P.A,P.T,5)+line(P.S,P.E)+line(P.E,P.W);
    const at=pat.hold==='P'?[P.P[0],P.P[1]-9]:pat.hold==='A'?P.A:W;
    if(pat.hold==='A')g+=`<circle cx="${at[0]}" cy="${at[1]}" r="5.5" fill="var(--accent)"/>`;
    else if(at&&!(pat.hold==='P'&&ex.load==='bw'))g+=wt(load,at);
  }
  g+=`<circle cx="${P.H[0]}" cy="${P.H[1]}" r="9" fill="var(--surface)" stroke="var(--ink)" stroke-width="4"/>`;
  return `<figure class="fig"><svg viewBox="0 -14 200 160" role="img" aria-label="${esc(ex.n)}: ${label} position">${g}</svg><figcaption>${label}</figcaption></figure>`;
}
function wt(kind,p){
  if(!p)return '';const [x,y]=p;
  if(kind==='bb')return `<circle cx="${x}" cy="${y}" r="11" fill="var(--accent-soft)" stroke="var(--accent)" stroke-width="3"/><circle cx="${x}" cy="${y}" r="2.5" fill="var(--accent)"/>`;
  if(kind==='db'||kind==='db1')return `<rect x="${x-8}" y="${y-2}" width="16" height="4" fill="var(--accent)"/><rect x="${x-11}" y="${y-6}" width="5" height="12" rx="1" fill="var(--accent)"/><rect x="${x+6}" y="${y-6}" width="5" height="12" rx="1" fill="var(--accent)"/>`;
  if(kind==='ball')return `<circle cx="${x}" cy="${y+2}" r="9" fill="var(--accent)"/>`;
  if(kind==='bell')return `<circle cx="${x}" cy="${y+8}" r="8" fill="var(--accent)"/><path d="M${x-5} ${y+2} Q${x} ${y-6} ${x+5} ${y+2}" fill="none" stroke="var(--accent)" stroke-width="3"/>`;
  if(kind==='stack'||kind==='band'||kind==='handle')return `<circle cx="${x}" cy="${y}" r="4" fill="var(--accent)"/>`;
  return '';
}
function exGraphic(ex){
  const pat=PAT[EX_PAT[ex.id]];if(!pat)return '';
  if(pat.hold===true)return `<div class="figs one">${poseSVG(ex,pat,pat.a,'Hold')}</div>`;
  return `<div class="figs">${poseSVG(ex,pat,pat.a,'Start')}<span class="figarrow" aria-hidden="true">→</span>${poseSVG(ex,pat,pat.b,'Finish')}</div>`;
}
function exSteps(ex){const pat=PAT[EX_PAT[ex.id]];return pat?{steps:pat.steps,avoid:pat.avoid}:{steps:[],avoid:[]};}

function hashDay(s){let h=0;for(const c of s)h=(h*31+c.charCodeAt(0))|0;return Math.abs(h);}
function weekCount(p){const a=isoDate(dateFor(0)),b=isoDate(dateFor(6));return new Set((p.sessions||[]).filter(s=>s.date>=a&&s.date<=b).map(s=>s.date)).size;}
function cheerLine(p,plan){

  if(!sess.length)return 'Day one. The hardest part is starting, and you’re here.';

/* ---------- storage ---------- */
const Store={mode:'local',col:null,q:{},drafts:{},pend:0,
  async init(){
    try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();}catch(e){}
    this.mode='local';return lsGet('atlas.v1',[]);
  },
  save(p){
    if(this.mode!=='cloud'){lsSet('atlas.v1',S.profiles);return;}
    const k='p_'+p.id,body=JSON.parse(JSON.stringify(p));
    const prev=this.q[k]||Promise.resolve();
    this.pend++;
    this.q[k]=prev.then(()=>this.col.doc(k).set(body)).catch(err=>{console.warn(err);S.saveErr=true;lsSet('atlas.v1',S.profiles);render();}).finally(()=>{this.pend--;});
  },
  saveDraft(pid,k,d){
    if(this.mode!=='cloud')return;
    const body=JSON.parse(JSON.stringify({k:k||null,d:d||null,ts:(d&&d._ts)||Date.now()}));
    this.drafts[pid]=body;
    clearTimeout(this.dt);this.pend++;
    this.dt=setTimeout(()=>{this.col.doc('d_'+pid).set(body).catch(e=>console.warn(e)).finally(()=>{this.pend--;});},500);
  },
  // Re-reads the account when Atlas comes back on screen: picks up workouts logged or started on another device.
  async refresh(){
    if(this.mode!=='cloud'||this.pend>0)return false;
    try{
      const snap=await this.col.get();if(this.pend>0)return false;let changed=false;
      snap.docs.forEach(doc=>{
        const v=JSON.parse(JSON.stringify(doc.data()));
        if(doc.id.indexOf('d_')===0)this.drafts[doc.id.slice(2)]=v;
        else if(doc.id.indexOf('p_')===0){const i=S.profiles.findIndex(q=>q.id===v.id);
          if(i>=0&&JSON.stringify(S.profiles[i])!==JSON.stringify(v)){S.profiles[i]=v;changed=true;}}
      });
      return mergeDrafts()||changed;
    }catch(e){return false;}
  },
  async remove(p){
    if(this.mode==='cloud'){try{await this.col.doc('p_'+p.id).delete();}catch(e){S.saveErr=true;}}
    else lsSet('atlas.v1',S.profiles);
  }
};

/* ---------- drafts ---------- */
const draftKey=(p,day)=>p.id+'|'+isoDate()+'|'+day.wd;
function getDraft(p,day){
  const k=draftKey(p,day);
  if(!S.drafts[k])S.drafts[k]=lsGet('atlas.d.'+k,{})||{};
  const d=S.drafts[k];
  day.items.forEach(it=>{
    if(!d[it.key]||d[it.key].ex!==it.ex.id)d[it.key]={ex:it.ex.id,sets:Array.from({length:it.rx.sets},()=>({w:it.w??'',r:'',done:false}))};
    else{const s=d[it.key].sets;while(s.length<it.rx.sets)s.push({w:it.w??'',r:'',done:false});while(s.length>it.rx.sets&&!s[s.length-1].done)s.pop();}
  });
  return d;
}
// Saves an in-progress workout here and to the account, so it can be picked up on another device.
function saveDraft(p,day,d){const k=draftKey(p,day);d._ts=Date.now();S.drafts[k]=d;lsSet('atlas.d.'+k,d);Store.saveDraft(p.id,k,d);}
function clearDraft(p,k){delete S.drafts[k];lsDel('atlas.d.'+k);Store.saveDraft(p.id,null,null);}
const draftStarted=d=>!!(d&&(d._warm||Object.values(d).some(v=>v&&v.sets&&v.sets.some(s=>s.done||s.skip))));
// Pulls in a newer in-progress workout saved from another device. Returns true if anything changed.
function mergeDrafts(){
  const today=isoDate();let changed=false;
  Object.entries(Store.drafts).forEach(([pid,r])=>{
    if(!r||!r.ts)return;
    if(r.k&&r.d&&r.k.split('|')[1]===today){
      const local=S.drafts[r.k]||lsGet('atlas.d.'+r.k,null);
      if(!local||(local._ts||0)<r.ts){S.drafts[r.k]=r.d;lsSet('atlas.d.'+r.k,r.d);changed=true;}
    }else if(!r.k){
      for(let wd=0;wd<7;wd++){const k=pid+'|'+today+'|'+wd,local=S.drafts[k]||lsGet('atlas.d.'+k,null);
        if(local&&local._ts&&local._ts<r.ts){delete S.drafts[k];lsDel('atlas.d.'+k);changed=true;}}
    }
  });
  return changed;
}
function restartHTML(d){
  if(!draftStarted(d))return '';
  if(S.confirmRestart)return `<div class="banner bad">Restart this workout? Every checked and skipped set for today is cleared.<div style="display:flex;gap:8px;margin-top:10px"><button class="btn danger" data-act="restartyes">Restart</button><button class="btn sec" data-act="restartno">Keep going</button></div></div>`;
  return `<button class="link" style="align-self:center;color:var(--bad)" data-act="restart">Restart workout</button>`;
}
function skippedHTML(day,d){
  const sk=day.items.filter(it=>d[it.key]&&d[it.key].sets.some(s=>s.skip&&!s.done));
  return sk.length?`<div class="upnext">Skipped: ${sk.map(it=>`<span style="white-space:nowrap"><b>${esc(it.ex.n)}</b> <button class="link" data-act="unskip" data-k="${it.key}">Un-skip</button></span>`).join(' · ')}</div>`:'';
}
function lastFor(p,id){const t=isoDate(),s=p.sessions||[];for(let i=s.length-1;i>=0;i--){if(s[i].date===t)continue;const e=s[i].entries.find(e=>e.id===id);if(e)return{date:s[i].date,sets:e.sets};}return null;}
function lastLine(p,ex){const l=lastFor(p,ex.id);return l?`Last time (${fmtDay(new Date(l.date+'T12:00'))}): ${setStr(ex.id,l.sets).replace(/x/g,'×')}`:'';}

let wakeLock=null;
async function syncWake(){
  const want=!!S.guide&&document.visibilityState==='visible';
  try{
    if(want&&!wakeLock&&navigator.wakeLock){wakeLock=await navigator.wakeLock.request('screen');wakeLock.addEventListener('release',()=>{wakeLock=null;});}
    else if(!want&&wakeLock){const w=wakeLock;wakeLock=null;await w.release();}
  }catch(e){wakeLock=null;}
}
let actx=null;
function unlockAudio(){try{if(!actx){const A=window.AudioContext||window.webkitAudioContext;if(A)actx=new A();}if(actx&&actx.state==='suspended')actx.resume();}catch(e){}}
function beep(){
  try{if(!actx)return;const t=actx.currentTime;
    [0,0.28].forEach(o=>{const g=actx.createGain(),osc=actx.createOscillator();osc.type='sine';osc.frequency.value=880;
      g.gain.setValueAtTime(0.0001,t+o);g.gain.exponentialRampToValueAtTime(0.35,t+o+0.02);g.gain.exponentialRampToValueAtTime(0.0001,t+o+0.2);
      osc.connect(g);g.connect(actx.destination);osc.start(t+o);osc.stop(t+o+0.22);});
  }catch(e){}
}

function monthData(p,y,m){

function render(){
  if(S.loading){$app.innerHTML='<div class="shell"><div class="loading">Opening Atlas…</div></div>';return;}
  const p=active();
  if(!p||S.editing||S.adding){
    const rs=!S.profiles.length?`<section class="card"><h2>Coming from Atlas in Claude?</h2><p class="note" style="margin:4px 0 10px">Restore your backup file to pick up where you left off.</p><button class="btn sec wide" data-act="bkimport">Restore from backup file</button>${S.bkMsg?`<p class="formerr" style="margin-top:8px">${esc(S.bkMsg)}</p>`:''}</section>`:'';
    $app.innerHTML=`<div class="shell">${header(p&&!S.adding?p:null)}<main>${rs}${setupView(S.editing?p:null)}</main></div>`;
    return;
  }
  const plan=buildPlan(p);
  let body='';
  if(S.saveErr)body+=`<div class="banner bad">Couldn’t save to your account. Changes are kept in this browser for now.</div>`;
  if(S.tab==='today')body+=todayView(p,plan);
  else if(S.tab==='week')body+=weekView(p,plan);
  else if(S.tab==='lib')body+=libView(p,plan);
  else if(S.tab==='progress')body+=progressView(p,plan);
  else body+=profileView(p);
  $app.innerHTML=`<div class="shell">${header(p)}<main>${body}</main></div>${timerHTML()}${tabs()}${sheetView(p,plan)}`;

}

function startTimer(sec,label){S.timer={end:Date.now()+sec*1000,total:sec,label,buzzed:false};renderTimer();}
function renderTimer(){
  const el=document.getElementById('timer');if(!el)return;
  if(!S.timer){el.hidden=true;return;}
  const left=Math.max(0,Math.ceil((S.timer.end-Date.now())/1000));
  el.hidden=false;
  el.querySelector('.tt').textContent=left>0?fmtClock(left):'Go';
  el.querySelector('.tl').textContent=left>0?S.timer.label:'Rest done. Next set.';
  el.querySelector('.tbar i').style.width=(100*(1-left/S.timer.total))+'%';
  if(left===0&&!S.timer.buzzed){S.timer.buzzed=true;try{navigator.vibrate&&navigator.vibrate([200,100,200]);}catch(e){}beep();const t=S.timer;setTimeout(()=>{if(S.timer===t){S.timer=null;renderTimer();}},4000);}
}

function setActive(id){S.activeId=id;lsSet('atlas.active',id);}
function currentDay(p,plan){return dayFor(p,plan,S.viewDay??todayIdx());}
function keepScroll(fn){const y=window.scrollY;fn();render();window.scrollTo({top:y});}
function finishWorkout(){
  const p=active(),plan=buildPlan(p),day=currentDay(p,plan);if(!day)return;
  const k=draftKey(p,day),d=getDraft(p,day);
  const snap={pid:p.id,prog:JSON.parse(JSON.stringify(p.prog||{})),extra:p.extra?JSON.parse(JSON.stringify(p.extra)):null,k,d:JSON.parse(JSON.stringify(d)),t:Date.now()};
  const entries=[],rows=[];p.prog=p.prog||{};let prs=0;
  day.items.forEach(it=>{
    const done=d[it.key].sets.filter(s=>s.done);if(!done.length)return;
    const sets=done.map(s=>({w:+s.w||0,r:+s.r||0}));
    const prev=Math.max(0,...(p.sessions||[]).flatMap(s=>s.entries.filter(e=>e.id===it.ex.id).map(e=>bestEst(it.ex,e.sets))));
    const isPR=prev>0&&bestEst(it.ex,sets)>prev+0.01;if(isPR)prs++;
    entries.push({id:it.ex.id,sets,lo:it.lo,hi:it.hi});
    const pr={...(p.prog[it.ex.id]||{})};let note;
    const allTop=sets.length>=it.rx.sets&&sets.every(s=>s.r>=it.hi),anyLow=sets.some(s=>s.r<it.lo);
    if(it.w!=null&&mesoInfo(p).deload){pr.w=pr.w??it.w;note=`Deload week: weights stay at ${pr.w} lb. Back to building next week.`;}
    else if(it.w!=null){
      const base=sets[0].w||it.w;pr.w=base;
      if(allTop){pr.w=base+incFor(it.ex);pr.stall=0;note=`Up to ${pr.w} lb next time`;}
      else if(anyLow){pr.stall=(pr.stall||0)+1;if(pr.stall>=2){pr.w=roundW(it.ex,base*0.9);pr.stall=0;note=`Reset to ${pr.w} lb and build back up`;}else note=`Stay at ${base} lb`;}
      else{pr.stall=0;note=`Stay at ${base} lb until you hit ${it.hi} on every set`;}
    }else{
      if(allTop){pr.bonus=(pr.bonus||0)+(it.ex.load==='time'?10:2);note=`Target rises to ${it.lo+(it.ex.load==='time'?10:2)}–${it.hi+(it.ex.load==='time'?10:2)}${it.ex.load==='time'?' sec':' reps'}`;if(it.ex.load==='bw'&&pr.bonus>=6)note+='. Ready for a harder version: try Swap.';}
      else note='Same target next time';
    }
    if(isPR)note='New personal best! '+note;
    pr.last=isoDate();p.prog[it.ex.id]=pr;rows.push({n:it.ex.n,note,up:allTop||isPR});
  });
  if(!entries.length){S.flash='Check off at least one set before finishing.';render();return;}
  S.flash='';
  p.sessions=p.sessions||[];p.sessions.push({date:isoDate(),name:day.name,di:day.catchup?null:day.di,tk:day.catchup?null:day.tk,entries});
  snap.ref=p.sessions[p.sessions.length-1];S.undo=snap;S.confirmRestart=false;
  if(p.sessions.length>200)p.sessions=p.sessions.slice(-200);
  clearDraft(p,k);
  if(p.extra&&p.extra.date===isoDate())delete p.extra;
  const total=p.sessions.length,wc=weekCount(p),planned=plan.days.length;
  let headline=MILESTONES[total]||(prs?`${prs} new personal best${prs>1?'s':''} today. That’s what all those sets are for.`:'Workout saved. You showed up and did the work, and that’s what counts.');
  const week=wc>=planned?`All ${planned} workouts done this week. Outstanding.`:`${wc} of ${planned} workouts done this week.`;
  S.summary={name:day.name,rows,headline,week};S.timer=null;S.guide=false;S.cheer='';
  Store.save(p);render();window.scrollTo({top:0});
}
function readForm(f){
  const fd=new FormData(f);
  const days=fd.getAll('day').map(Number);
  const start=/^\d{4}-\d{2}-\d{2}$/.test(String(fd.get('start')||''))?String(fd.get('start')):isoDate();
  const o={start,name:String(fd.get('name')||'').trim(),age:Math.round(+fd.get('age')),sex:fd.get('sex'),ht:(+fd.get('ft'))*12+(+fd.get('in')),wt:+fd.get('wt'),exp:fd.get('exp'),goal:fd.get('goal'),focus:fd.getAll('focus'),days,minutes:+fd.get('minutes'),equip:fd.getAll('equip'),cGoal:fd.get('cGoal'),cModes:fd.getAll('cModes'),cMin:+fd.get('cMin')};
  if(!o.name)return[null,'Add a name.'];
  if(!(o.age>=13&&o.age<=90))return[null,'Atlas is built for ages 13 to 90. Check the age.'];
  if(!(o.wt>=70&&o.wt<=450))return[null,'Enter a weight between 70 and 450 lb.'];
  if(o.days.length<1)return[null,'Pick at least one lifting day.'];
  if(o.days.length>6)return[null,'Pick 6 days or fewer so you get at least one full rest day.'];

  const t=e.target,ds=t.dataset&&t.dataset.set;if(!ds)return;
  const [key,i,f]=ds.split('|');const p=active(),plan=buildPlan(p),day=currentDay(p,plan);if(!day)return;
  const d=getDraft(p,day);d[key].sets[+i][f]=t.value;saveDraft(p,day,d);
});
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b)return;
  if(b.dataset.act==='close'&&b.classList.contains('scrim')&&e.target.closest('[data-stop]'))return;
  const a=b.dataset.act,p=active();
  unlockAudio();
  switch(a){
    case 'shuffle':{const di=+b.dataset.di;p.seeds=p.seeds||{};p.seeds[di]=uid();
      // A shuffle replaces any manual swaps on that workout.
      if(p.over)Object.keys(p.over).forEach(k=>{if(new RegExp('^d'+di+'[a-z]').test(k))delete p.over[k];});
      Store.save(p);keepScroll(()=>{});break;}
    case 'restart':S.confirmRestart=true;keepScroll(()=>{});break;
    case 'restartno':S.confirmRestart=false;keepScroll(()=>{});break;
    case 'restartyes':{const plan=buildPlan(p),day=currentDay(p,plan);S.confirmRestart=false;if(!day)break;
      clearDraft(p,draftKey(p,day));S.timer=null;S.cheer='';S.flash='';S.guide=false;render();window.scrollTo({top:0});break;}
    case 'unskip':{const plan=buildPlan(p),day=currentDay(p,plan);if(!day)break;const d=getDraft(p,day),x=d[b.dataset.k];if(!x)break;
      x.sets.forEach(s=>{delete s.skip;});saveDraft(p,day,d);keepScroll(()=>{});break;}
    case 'undofin':{const u=S.undo;if(!u||u.pid!==p.id)break;
      p.sessions=(p.sessions||[]).filter(s=>s!==u.ref);p.prog=u.prog;if(u.extra)p.extra=u.extra;else delete p.extra;
      u.d._ts=Date.now();S.drafts[u.k]=u.d;lsSet('atlas.d.'+u.k,u.d);Store.saveDraft(p.id,u.k,u.d);
      S.undo=null;S.summary=null;Store.save(p);render();window.scrollTo({top:0});break;}
    case 'tab':S.tab=b.dataset.tab;S.editing=false;S.adding=false;S.confirmDel=null;if(S.tab==='today')S.viewDay=null;render();window.scrollTo({top:0});break;
    case 'day':S.viewDay=+b.dataset.wd;S.flash='';render();break;
    case 'done':{
      const plan=buildPlan(p),day=currentDay(p,plan);if(!day)break;const it=day.items.find(x=>x.key===b.dataset.k),d=getDraft(p,day),s=d[b.dataset.k].sets[+b.dataset.i];
      s.done=!s.done;
      if(s.done){if(s.r==='')s.r=String(it.hi);if(it.w!=null&&s.w==='')s.w=String(it.w);
        if(it.partner)startTimer(45,`Switch to ${it.partner.label} · ${it.partner.ex.n}`);else startTimer(it.rx.rest,`Rest · ${it.ex.n}`);}
      saveDraft(p,day,d);
      const y=window.scrollY;render();window.scrollTo({top:y});break;}
    case 'finish':finishWorkout();break;
    case 'guide':S.guide=true;S.flash='';S.cheer='';S.viewDay=S.viewDay??todayIdx();render();window.scrollTo({top:0});break;
    case 'unguide':S.guide=false;render();break;
    case 'warm':{const plan=buildPlan(p),day=currentDay(p,plan);if(!day)break;const d=getDraft(p,day);d._warm=true;S.cheer='Warmed up. First working set: own the form.';saveDraft(p,day,d);keepScroll(()=>{});break;}
    case 'gstep':{const plan=buildPlan(p),day=currentDay(p,plan);if(!day)break;const d=getDraft(p,day),steps=guideSteps(day);
      const cur=steps.find(([it,i])=>{const s=d[it.key].sets[i];return s&&!s.done&&!s.skip;});if(!cur)break;
      const [it,i]=cur,s=d[it.key].sets[i],f=b.dataset.f,dv=+b.dataset.d;
      if(f==='w'){const base=s.w===''?it.w:+s.w;s.w=String(Math.max(0,base+dv));}
      else{const base=s.r===''?it.hi:+s.r;s.r=String(Math.max(0,base+dv));}
      saveDraft(p,day,d);render();break;}
    case 'gdone':{const plan=buildPlan(p),day=currentDay(p,plan);if(!day)break;const d=getDraft(p,day),steps=guideSteps(day);
      const k=steps.findIndex(([it,i])=>{const s=d[it.key].sets[i];return s&&!s.done&&!s.skip;});if(k<0)break;
      const [it,i]=steps[k],s=d[it.key].sets[i];
      if(s.r==='')s.r=String(it.hi);if(it.w!=null&&s.w==='')s.w=String(it.w);s.done=true;
      // carry this set's weight forward to the next set of the same exercise
      const ns=d[it.key].sets[i+1];if(ns&&!ns.done&&it.w!=null&&(ns.w===''||+ns.w===it.w))ns.w=s.w;
      saveDraft(p,day,d);
      {const rr=+s.r,doneN=steps.filter(([a,j])=>{const z=d[a.key].sets[j];return z&&(z.done||z.skip);}).length,total=steps.length,lastOfEx=!d[it.key].sets.some(z=>!z.done&&!z.skip);
        let msg=rr>=it.hi?'Top of the range. Strong set.':rr>=it.lo?SET_CHEERS[(doneN+hashDay(isoDate()))%SET_CHEERS.length]:'Tough one. Every rep still counts. Drop the weight a little if form slips.';
        if(lastOfEx)msg=`${it.ex.n} done. ${rr>=it.hi?'You owned that one.':'One more exercise in the books.'}`;
        if(doneN===Math.ceil(total/2)&&doneN<total)msg='Halfway there. Keep the same focus.';
        if(doneN===total-1)msg='One set left. Finish strong.';
        S.cheer=msg;}
      const nx=steps.slice(k+1).find(([a,j])=>{const z=d[a.key].sets[j];return z&&!z.done&&!z.skip;});
      if(!nx)S.timer=null;
      else if(nx[0]!==it&&it.partner===nx[0])startTimer(30,`Next: ${nx[0].ex.n}`);
      else if(nx[0]!==it)startTimer(Math.max(60,Math.round(it.rx.rest*0.75)),`Next: ${nx[0].ex.n}`);
      else startTimer(it.rx.rest,`Rest · then set ${nx[1]+1}`);
      render();window.scrollTo({top:0});break;}
    case 'gskip':{const plan=buildPlan(p),day=currentDay(p,plan);if(!day)break;const d=getDraft(p,day),steps=guideSteps(day);
      const cur=steps.find(([it,i])=>{const s=d[it.key].sets[i];return s&&!s.done&&!s.skip;});if(!cur)break;
      d[cur[0].key].sets.forEach(s=>{if(!s.done)s.skip=true;});saveDraft(p,day,d);render();break;}
    case 'cien':S.ci=S.ci||{energy:null,sore:[]};S.ci.energy=b.dataset.v;keepScroll(()=>{});break;
    case 'cisore':{S.ci=S.ci||{energy:null,sore:[]};const m=b.dataset.m,i=S.ci.sore.indexOf(m);if(i<0)S.ci.sore.push(m);else S.ci.sore.splice(i,1);keepScroll(()=>{});break;}
    case 'cisave':if(!S.ci||!S.ci.energy)break;p.checkin={date:isoDate(),energy:S.ci.energy,sore:S.ci.sore.slice()};S.ci=null;S.ciEdit=false;Store.save(p);keepScroll(()=>{});break;
    case 'ciedit':{const c=p.checkin;S.ciEdit=true;S.ci={energy:c?c.energy:null,sore:c&&c.sore?c.sore.slice():[]};keepScroll(()=>{});break;}
    case 'cicancel':S.ciEdit=false;S.ci=null;keepScroll(()=>{});break;
    case 'cdone':{const t=isoDate(),c=buildPlan(p).cardio[todayIdx()];p.cdone=t;p.clog=(p.clog||[]).filter(x=>x.date!==t);if(c)p.clog.push({date:t,title:c.title,min:c.min,mode:c.mode});if(p.clog.length>400)p.clog=p.clog.slice(-400);Store.save(p);keepScroll(()=>{});break;}
    case 'cundo':{const t=isoDate();delete p.cdone;p.clog=(p.clog||[]).filter(x=>x.date!==t);Store.save(p);keepScroll(()=>{});break;}
    case 'calmode':S.calMode=b.dataset.v;S.calMsg='';S.calDay=null;keepScroll(()=>{});break;
    case 'calprev':case 'calnext':{const dir=a==='calprev'?-1:1;S.calMsg='';S.calDay=null;
      if(S.calMode==='week')S.wk=addDays(calWeek(),7*dir);
      else{const c=calMonth();let m=c.m+dir,y=c.y;if(m<0){m=11;y--;}if(m>11){m=0;y++;}S.cal={y,m};}
      keepScroll(()=>{});break;}
    case 'calday':S.calDay=S.calDay===b.dataset.d?null:b.dataset.d;keepScroll(()=>{});break;
    case 'calpdf':exportPdf();break;
    case 'bkexport':exportBackup();break;
    case 'bkimport':pickBackup();break;
    case 'addm':{const plan=buildPlan(p),wd=todayIdx(),day=dayFor(p,plan,wd),eq=eqSet(p),m=b.dataset.m;
      const used=new Set(day?day.items.map(i=>i.ex.id):[]);
      const ex=pickEx({m,k:day?'i':'c'},eq,used,{},p);if(!ex)break;
      if(!p.extra||p.extra.date!==isoDate()||p.extra.wd!==wd)p.extra={date:isoDate(),wd,list:[]};
      if(!p.extra.list.some(x=>x.m===m))p.extra.list.push({m,id:ex.id});
      S.viewDay=wd;Store.save(p);keepScroll(()=>{});break;}
    case 'rmx':if(p.extra){p.extra.list=p.extra.list.filter(x=>x.m!==b.dataset.m);if(!p.extra.list.length)delete p.extra;Store.save(p);}keepScroll(()=>{});break;
    case 'dismiss':S.summary=null;S.undo=null;render();break;
    case 'skiptimer':S.timer=null;renderTimer();break;
    case 'swap':S.sheet={type:'swap',key:b.dataset.key,m:b.dataset.m,cur:b.dataset.cur};{const y=window.scrollY;render();window.scrollTo({top:y});}break;
    case 'info':S.sheet={type:'info',ex:b.dataset.ex};{const y=window.scrollY;render();window.scrollTo({top:y});}break;
    case 'close':S.sheet=null;{const y=window.scrollY;render();window.scrollTo({top:y});}break;
    case 'pick':{p.over=p.over||{};p.over[S.sheet.key]=b.dataset.ex;S.sheet=null;Store.save(p);const y=window.scrollY;render();window.scrollTo({top:y});break;}
    case 'openday':S.openDay=S.openDay===+b.dataset.wd?null:+b.dataset.wd;render();break;
    case 'libm':S.libM=b.dataset.m;render();break;
    case 'edit':S.editing=true;S.formErr='';render();window.scrollTo({top:0});break;
    case 'add':S.adding=true;S.formErr='';render();window.scrollTo({top:0});break;
    case 'cancel':S.editing=false;S.adding=false;S.formErr='';render();break;
    case 'switch':setActive(b.dataset.id);S.summary=null;S.viewDay=null;render();break;
    case 'del':S.confirmDel=p.id;render();break;
    case 'delno':S.confirmDel=null;render();break;
    case 'delyes':{S.profiles=S.profiles.filter(q=>q.id!==p.id);Store.remove(p);S.confirmDel=null;setActive(S.profiles[0]?S.profiles[0].id:null);S.tab='today';render();break;}
    case 'spread':{
      const f=document.getElementById('setup');const boxes=[...f.querySelectorAll('input[name="day"]')];
      const n=Math.min(6,Math.max(2,boxes.filter(x=>x.checked).length||3));
      boxes.forEach(x=>x.checked=SPREAD[n].includes(+x.value));break;}
  }
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&S.sheet){S.sheet=null;render();}});

/* ---------- boot ---------- */
if('serviceWorker' in navigator&&location.protocol!=='file:')window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
(async function(){
  S.profiles=await Store.init()||[];
  mergeDrafts();
  document.addEventListener('visibilitychange',()=>{syncWake();if(document.visibilityState==='visible'&&!S.loading)Store.refresh().then(ch=>{if(ch&&!S.editing&&!S.adding)keepScroll(()=>{});});});
  const saved=lsGet('atlas.active',null);
  S.activeId=S.profiles.find(p=>p.id===saved)?saved:(S.profiles[0]?S.profiles[0].id:null);
  S.loading=false;render();
})();
})();
</script>
